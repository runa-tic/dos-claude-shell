# DOSBox-X profile: boot a real DOS from the disk image named by IMG, with an
# NE2000 on the slirp network (the host is 10.0.2.2, as under QEMU).
[dosbox]
memsize = 16

[cpu]
cputype = pentium
cycles  = max

[dos]
ver = 7.1

[ne2000]
ne2000  = true
nicbase = 300
nicirq  = 10
macaddr = AC:DE:48:00:00:01
backend = slirp

[autoexec]
imgmount 2 "%IMG%" -t hdd -fs none
boot -l c
